<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>I.L. COLECCIÓN</title>
    <style>
        body { background-color: #0d0d0d; color: #c4a161; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .main-logo { width: 200px; margin-top: 30px; }
        h1 { letter-spacing: 5px; }
        .drops-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 40px; }
        .drop-card { width: 300px; }
        .product-image { width: 100%; border: 1px solid #333; }
        .status { background: #1a1a1a; padding: 10px; margin-top: 10px; border: 1px solid #333; color: #c4a161; }
    </style>
</head>
<body>
    
    <img src="1000056646.jpg" class="main-logo" alt="Logo">
    <h1>I.L. COLECCIÓN</h1>
    
    <div class="drops-container">
        <div class="drop-card">
            <h3>EUPHORIA</h3>
            <img src="IMG-20260526-WA0049.jpg" class="product-image" alt="Euphoria">
            <div class="status">PRÓXIMAMENTE</div>
        </div>
        <div class="drop-card">
            <h3>EDICIÓN LIMITADA</h3>
            <img src="IMG-20260526-WA0033.jpg" class="product-image" alt="Limitada">
            <div class="status">PRÓXIMAMENTE</div>
        </div>
    </div>
</body>
</html>
