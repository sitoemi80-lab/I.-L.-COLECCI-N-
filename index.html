<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.L. COLECCIÓN</title>
    <style>
        body { background-color: #0d0d0d; color: #c4a161; font-family: 'Georgia', serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { text-align: center; padding: 60px 20px; }
        .main-logo { width: 250px; margin-bottom: 20px; }
        h1 { font-size: 2.5em; letter-spacing: 6px; margin: 0 0 10px 0; font-weight: normal; }
        .header-info { font-size: 0.9em; letter-spacing: 2px; color: #888; line-height: 1.6; }
        .drops-section { width: 100%; max-width: 1200px; padding: 40px 20px; text-align: center; }
        .drops-title { font-size: 1.8em; letter-spacing: 5px; margin-bottom: 40px; }
        .drops-container { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .drop-card { width: calc(50% - 40px); max-width: 500px; margin-bottom: 40px; text-align: left; }
        .drop-name { font-size: 1.1em; letter-spacing: 3px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .product-image { width: 100%; height: auto; border-radius: 4px; border: 1px solid #333; }
        .status-bar { background-color: #1a1a1a; color: #c4a161; padding: 15px; font-size: 0.9em; letter-spacing: 2px; border-radius: 4px; text-align: center; border: 1px solid #333; text-transform: uppercase; margin-top: 20px; }
        @media (max-width: 768px) { .drop-card { width: 100%; } }
    </style>
</head>
<body>

    <header>
        <img src="https://i.ibb.co/L5Qx6Tq/1000056646.jpg" alt="I.L. Colección Logo" class="main-logo">
        <h1>I.L. COLECCIÓN</h1>
        <div class="header-info">
            EST. 2026<br>DISEÑO INDEPENDIENTE<br>HECHO EN MÉXICO
        </div>
    </header>

    <main class="drops-section">
        <h2 class="drops-title">DROPS</h2>
        <div class="drops-container">
            <div class="drop-card">
                <div class="drop-name">DROP: EUPHORIA</div>
                <img src="https://i.ibb.co/3sX8P2q/1000056661.jpg" alt="Camiseta Euphoria" class="product-image">
                <div class="status-bar">PRÓXIMAMENTE - PRÓXIMO DROP: EUPHORIA</div>
            </div>
            <div class="drop-card">
                <div class="drop-name">DROP: EDICIÓN LIMITADA</div>
                <img src="https://i.ibb.co/WnZ7k8q/1000056615.jpg" alt="Camiseta Limitada" class="product-image">
                <div class="status-bar">PRÓXIMAMENTE - EDICIÓN LIMITADA (PRONTO)</div>
            </div>
        </div>
    </main>

</body>
</html>
